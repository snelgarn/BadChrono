<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadChrono Mobile Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container-wrapper">
        <div id="container"></div>
        <button id="add-button"><img src="images/plus-circle-svgrepo-com.svg" alt="plus" class="config-button-icon"></button>
        <button id="chrono-button"><img src="images/check-svgrepo-com.svg" alt="check" class="config-button-icon"></button>
        <button id="config-button"><img src="images/sliders-svgrepo-com.svg" alt="edit" class="config-button-icon"></button>
        <div id="config-menu">
            <h3 class="config-title">Configuration</h3>
            <div class="config-item">
                <label class="config-label" for="zoom-level">Zoom Level</label>
                <input type="range" id="zoom-level" class="config-input" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="config-item">
                <label class="config-label" for="orange-alarm">Orange Alarm</label>
                <input type="text" id="orange-alarm" class="config-input" placeholder="00:30">
            </div>
            <div class="config-item">
                <label class="config-label" for="red-alarm">Red Alarm</label>
                <input type="text" id="red-alarm" class="config-input" placeholder="01:00">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
