<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadChrono Mobile Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container"></div>
    <button id="add-button">+</button>
    <button id="chrono-button">✓</button>
    <button id="config-button">⚙️</button>
    <div id="config-menu">
        <h3 class="config-title">Configuration</h3>
        <div class="config-item">
            <label class="config-label">Zoom Level</label>
            <input type="range" id="zoom-level" class="config-input" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="config-item">
            <label class="config-label">Orange Alarm (seconds)</label>
            <input type="number" id="orange-alarm" class="config-input" min="1" value="30">
        </div>
        <div class="config-item">
            <label class="config-label">Red Alarm (seconds)</label>
            <input type="number" id="red-alarm" class="config-input" min="1" value="60">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
